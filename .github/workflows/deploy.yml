name: 🚀 Secure Manual Deploy PHP Backend to GoDaddy

on:
  workflow_dispatch: # Allows you to manually trigger this deployment from the GitHub Actions tab

jobs:
  web-backup-and-deploy:
    name: 🛡️ Backup & Sync Files
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest repository code
        uses: actions/checkout@v4

      # STEP 1: Connect via FTP and download the current live server files to create a backup
      - name: 📦 Create Server-Side Backup via FTP Download
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21                        # Changing back to standard FTP port
          server-dir: public_html/apiapp/ # Where your live files are
          local-dir: backups/ # Downloads them safely into this temporary runner folder
          protocol: ftp

      # STEP 2: Deploy the fresh code updates over FTP
      - name: 📂 Sync files over FTP to GoDaddy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/apiapp/ 
          protocol: ftp
          port: 21
