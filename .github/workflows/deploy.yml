name: 🚀 Secure Manual Deploy PHP Backend to GoDaddy

on:
  workflow_dispatch:

jobs:
  web-backup-and-deploy:
    name: 🛡️ Backup & Sync Files
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest repository code
        uses: actions/checkout@v4

      # STEP 1: Securely trigger the server-side zip backup engine using curl
      - name: 📦 Trigger Server-Side Zip Backup
        run: |
          curl -sS --fail "https://cloudcomai.com"

      # STEP 2: Deploy the fresh code updates over FTP
      - name: 📂 Sync files over FTP to GoDaddy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/apiapp/ 
          protocol: ftp
          port: 21
