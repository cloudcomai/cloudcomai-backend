name: 🚀 Secure Manual Deploy PHP Backend to GoDaddy

on:
  workflow_dispatch:

jobs:
  web-backup-and-deploy:
    name: 🛡️ Backup, Migrate & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest repository code
        uses: actions/checkout@v4

      # STEP 1: Backup production before making any server-side changes.
      - name: 📦 Trigger Server-Side Zip Backup
        run: |
          curl -sS --fail "https://cloudcomai.com"

      # STEP 2: Build an isolated migration package. It is uploaded under
      # /apiapp/deploy-migrations/, so FTP sync can never delete live API files.
      - name: 📦 Prepare migration package
        run: |
          rm -rf migration-package
          mkdir -p migration-package/scripts migration-package/database/migrations migration-package/api
          cp scripts/migrate.php migration-package/scripts/migrate.php
          cp api/deploy-migrate.php migration-package/api/deploy-migrate.php
          cp database/migrations/*.sql migration-package/database/migrations/

      - name: 📂 Upload migration package only
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./migration-package/
          server-dir: public_html/apiapp/deploy-migrations/
          protocol: ftp
          port: 21

      # STEP 3: Ask the isolated server endpoint to execute PHP migrations.
      - name: 🗄️ Run database migrations
        env:
          MIGRATION_TOKEN: ${{ secrets.MIGRATION_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${MIGRATION_TOKEN}" \
            -H "Accept: application/json" \
            https://www.cloudcomai.com/apiapp/deploy-migrations/api/deploy-migrate.php

      # STEP 4: Only reached when the migration request returned HTTP 2xx.
      - name: 📂 Sync application files over FTP to GoDaddy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/apiapp/
          protocol: ftp
          port: 21

      - name: ✅ Deployment completed
        run: echo "Database migrations and application deployment completed successfully."
