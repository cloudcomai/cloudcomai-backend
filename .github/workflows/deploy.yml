name: 🚀 Secure Manual Deploy PHP Backend to GoDaddy

on:
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: 'Choose initial recovery/full deployment once, then use release for subsequent deployments.'
        required: true
        type: choice
        default: release
        options:
          - initial
          - release

concurrency:
  group: cloudcomai-production-deploy
  cancel-in-progress: false

jobs:
  web-backup-and-deploy:
    name: 🛡️ Backup, Migrate, Deploy & Rollback
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest repository code
        uses: actions/checkout@v4

      - name: 📦 Prepare deployment recovery tools
        if: ${{ inputs.deployment_mode == 'initial' }}
        run: |
          rm -rf recovery-tools
          mkdir -p recovery-tools
          cp api/deploy-backup.php recovery-tools/deploy-backup.php
          cp api/restore-backup.php recovery-tools/restore-backup.php

      - name: 📂 Install deployment recovery tools
        if: ${{ inputs.deployment_mode == 'initial' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./recovery-tools/
          server-dir: public_html/apiapp/deploy-migrations/backup/
          protocol: ftp
          port: 21

      - name: 🛡️ Create verified compressed server backup
        id: backup
        env:
          MIGRATION_TOKEN: ${{ secrets.MIGRATION_TOKEN }}
        run: |
          RESPONSE=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${MIGRATION_TOKEN}" \
            -H "Accept: application/json" \
            https://www.cloudcomai.com/apiapp/deploy-migrations/backup/deploy-backup.php)

          SUCCESS=$(echo "${RESPONSE}" | python -c 'import json,sys; print(json.load(sys.stdin).get("success", False))')
          BACKUP=$(echo "${RESPONSE}" | python -c 'import json,sys; print(json.load(sys.stdin).get("backup", ""))')

          echo "Backup success: ${SUCCESS}"
          echo "Backup: ${BACKUP}"

          if [ "${SUCCESS}" != "True" ] || [ -z "${BACKUP}" ]; then
            echo "❌ Backup failed."
            exit 1
          fi

          echo "BACKUP_NAME=${BACKUP}" >> "$GITHUB_ENV"
          echo "✅ Backup completed successfully."

      - name: 🔐 Prepare initial full deployment package
        if: ${{ inputs.deployment_mode == 'initial' }}
        env:
          PRODUCTION_CONFIG_PHP: ${{ secrets.PRODUCTION_CONFIG_PHP }}
        run: |
          rm -rf deploy-package
          mkdir -p deploy-package
          rsync -a --exclude='.git/' --exclude='.github/' ./ deploy-package/

          if [ -z "${PRODUCTION_CONFIG_PHP}" ]; then
            echo "❌ PRODUCTION_CONFIG_PHP secret is required for the initial deployment."
            exit 1
          fi

          mkdir -p deploy-package/config
          printf '%s\n' "${PRODUCTION_CONFIG_PHP}" > deploy-package/config/config.php

          mkdir -p deploy-package/deploy-migrations/backup
          cp api/deploy-backup.php deploy-package/deploy-migrations/backup/deploy-backup.php
          cp api/restore-backup.php deploy-package/deploy-migrations/backup/restore-backup.php

      - name: 📂 Full initial deployment
        if: ${{ inputs.deployment_mode == 'initial' }}
        id: initial_deploy
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-package/
          server-dir: public_html/apiapp/
          protocol: ftp
          port: 21
          dangerous-clean-slate: true

      - name: 📦 Prepare migration package
        if: ${{ inputs.deployment_mode == 'release' }}
        run: |
          rm -rf migration-package
          mkdir -p migration-package/scripts migration-package/database/migrations migration-package/api migration-package/lib
          cp scripts/migrate.php migration-package/scripts/migrate.php
          cp scripts/migration-bootstrap.php migration-package/lib/bootstrap.php
          cp api/deploy-migrate.php migration-package/api/deploy-migrate.php
          cp database/migrations/*.sql migration-package/database/migrations/

      - name: 📂 Upload migration package only
        if: ${{ inputs.deployment_mode == 'release' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./migration-package/
          server-dir: public_html/apiapp/deploy-migrations/
          protocol: ftp
          port: 21
          exclude: |
            backup/**

      - name: 🗄️ Run database migrations
        id: migration
        if: ${{ inputs.deployment_mode == 'release' || (inputs.deployment_mode == 'initial' && steps.initial_deploy.outcome == 'success') }}
        env:
          MIGRATION_TOKEN: ${{ secrets.MIGRATION_TOKEN }}
        run: |
          RESPONSE=$(curl --silent --show-error \
            -H "Authorization: Bearer ${MIGRATION_TOKEN}" \
            -H "Accept: application/json" \
            https://www.cloudcomai.com/apiapp/deploy-migrations/api/deploy-migrate.php)

          echo "Migration response: ${RESPONSE}"

          SUCCESS=$(echo "${RESPONSE}" | python -c 'import json,sys; print(json.load(sys.stdin).get("success", False))')
          echo "Migration success: ${SUCCESS}"

          if [ "${SUCCESS}" != "True" ]; then
            echo "❌ Database migration failed."
            exit 1
          fi

          echo "✅ Database migrations completed successfully."

      - name: 📂 Deploy application release
        if: ${{ inputs.deployment_mode == 'release' && steps.migration.outcome == 'success' }}
        id: release_deploy
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: public_html/apiapp/
          protocol: ftp
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            config/config.php
            storage/**
            deploy-migrations/backup/**

      - name: 🔄 Roll back failed deployment to previous filesystem state
        if: ${{ steps.initial_deploy.outcome == 'failure' || steps.migration.outcome == 'failure' || steps.release_deploy.outcome == 'failure' }}
        env:
          MIGRATION_TOKEN: ${{ secrets.MIGRATION_TOKEN }}
        run: |
          RESPONSE=$(curl --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${MIGRATION_TOKEN}" \
            -H "Accept: application/json" \
            --data-urlencode "backup=${BACKUP_NAME}" \
            https://www.cloudcomai.com/apiapp/deploy-migrations/backup/restore-backup.php)

          echo "Rollback response: ${RESPONSE}"

          SUCCESS=$(echo "${RESPONSE}" | python -c 'import json,sys; print(json.load(sys.stdin).get("success", False))')
          echo "Rollback success: ${SUCCESS}"

          if [ "${SUCCESS}" != "True" ]; then
            echo "❌ Rollback failed. Manual server recovery is required."
            exit 1
          fi

          echo "✅ Previous filesystem state restored from compressed backup."
          exit 1

      - name: ❌ Fail deployment after rollback or failed initial package preparation
        if: ${{ failure() }}
        run: |
          echo "❌ Deployment did not complete."
          exit 1

      - name: ❌ Fail if release deployment was skipped unexpectedly
        if: ${{ inputs.deployment_mode == 'release' && steps.migration.outcome != 'success' }}
        run: |
          echo "❌ Release deployment was not allowed because migration did not succeed."
          exit 1

      - name: ❌ Fail if initial deployment was unsuccessful
        if: ${{ inputs.deployment_mode == 'initial' && steps.initial_deploy.outcome != 'success' }}
        run: |
          echo "❌ Initial deployment was not successful."
          exit 1

      - name: ✅ Deployment completed
        run: |
          echo "Backup success: True"
          echo "Migration success: True"
          echo "Deployment success: True"
          echo "Existing server state is protected by the compressed backup."
