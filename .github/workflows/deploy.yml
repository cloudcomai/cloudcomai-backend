name: 🚀 Secure Manual Deploy PHP Backend to GoDaddy

on:
  workflow_dispatch:

jobs:
  web-backup-and-deploy:
    name: 🛡️ Backup, Migrate & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest repository code
        uses: actions/checkout@v4

      # STEP 1: Upload only the backup endpoint into the isolated deployment area.
      # This makes the backup available even on the first deployment after the
      # old backup implementation was removed.
      - name: 📦 Prepare backup package
        run: |
          rm -rf backup-package
          mkdir -p backup-package
          cp api/deploy-backup.php backup-package/deploy-backup.php

      - name: 📂 Upload backup endpoint
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backup-package/
          server-dir: public_html/apiapp/deploy-migrations/backup/
          protocol: ftp
          port: 21

      # STEP 2: Create and verify a compressed backup on GoDaddy BEFORE any
      # application files are synchronized. The archive is stored outside
      # public_html and the endpoint retains only the five newest archives.
      - name: 🛡️ Create verified compressed server backup
        env:
          MIGRATION_TOKEN: ${{ secrets.MIGRATION_TOKEN }}
        run: |
          RESPONSE=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${MIGRATION_TOKEN}" \
            -H "Accept: application/json" \
            https://www.cloudcomai.com/apiapp/deploy-migrations/backup/deploy-backup.php)

          echo "Backup response: ${RESPONSE}"

          echo "${RESPONSE}" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("success") is True, data.get("error", "Backup failed"); assert int(data.get("size", 0)) > 0, "Backup archive is empty"; print(f"Verified backup: {data.get(\"backup\")} ({data.get(\"size\")} bytes)")'

      # STEP 3: Build an isolated migration package. It is uploaded under
      # /apiapp/deploy-migrations/, so FTP sync cannot delete live API files.
      - name: 📦 Prepare migration package
        run: |
          rm -rf migration-package
          mkdir -p migration-package/scripts migration-package/database/migrations migration-package/api
          cp scripts/migrate.php migration-package/scripts/migrate.php
          cp api/deploy-migrate.php migration-package/api/deploy-migrate.php
          cp database/migrations/*.sql migration-package/database/migrations/

      - name: 📂 Upload migration package only
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./migration-package/
          server-dir: public_html/apiapp/deploy-migrations/
          protocol: ftp
          port: 21

      # STEP 4: Run migrations. Application deployment is blocked unless this
      # request returns HTTP 2xx.
      - name: 🗄️ Run database migrations
        env:
          MIGRATION_TOKEN: ${{ secrets.MIGRATION_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${MIGRATION_TOKEN}" \
            -H "Accept: application/json" \
            https://www.cloudcomai.com/apiapp/deploy-migrations/api/deploy-migrate.php

      # STEP 5: Deploy the application only after the backup and migrations
      # have both succeeded.
      - name: 📂 Sync application files over FTP to GoDaddy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/apiapp/
          protocol: ftp
          port: 21

      - name: ✅ Deployment completed
        run: echo "Verified compressed backup, database migrations and application deployment completed successfully."
